name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            mcp-server/package-lock.json

      - name: Bağımlılıkları kur
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix mcp-server

      - name: Tüm derleme ve testleri çalıştır
        run: npm test
