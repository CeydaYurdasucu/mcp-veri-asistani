services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d salesdb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
